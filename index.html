<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axolotech — Monitor de Lago</title>
  <link rel="stylesheet" href="style.css" />
</head>
  
<body>

  <header class="topbar">
    <div class="topbar-left">
      <img src="image/logo.png" alt="Axolotech" class="logo-img" />
      <span class="logo">Axolotech</span>
      <span class="logo-sub">Sistema de Monitoreo</span>
    </div>
    <div class="topbar-right">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-label" id="status-label">Conectando...</span>
      <span class="last-seen" id="last-seen"></span>
      <button class="hamburger" id="hamburger" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Nav drawer -->
  <nav class="nav-drawer" id="nav-drawer">
    <a href="index.html" class="nav-link active">Inicio</a>
    <a href="patterns.html" class="nav-link">Patrones</a>
  </nav>
  <div class="nav-overlay" id="nav-overlay"></div>

  <div class="page-body">

    <aside class="side-banner">
      <img src="image/Banner.png" alt="Axolotech banner" />
    </aside>

    <main class="dashboard">

      <!-- ── Row 1: combined sensors card ── -->
      <div class="card card--sensors">
        <div class="card-label">Sensores</div>
        <div class="sensors-row">

          <div class="sensor-block color-temp">
            <div class="sensor-sub-label">Temperatura</div>
            <div class="sensor-value" id="val-temp">—</div>
            <div class="sensor-unit">°C</div>
            <div class="sensor-range" id="range-temp"></div>
            <div class="card-badge" id="badge-temp"></div>
          </div>

          <div class="sensor-divider"></div>

          <div class="sensor-block color-ph">
            <div class="sensor-sub-label">pH</div>
            <div class="sensor-value" id="val-ph">—</div>
            <div class="sensor-unit">pH</div>
            <div class="sensor-range" id="range-ph"></div>
            <div class="card-badge" id="badge-ph"></div>
          </div>

          <div class="sensor-divider"></div>

          <div class="sensor-block color-turbidity">
            <div class="sensor-sub-label">Turbidez</div>
            <div class="sensor-value" id="val-turbidity">—</div>
            <div class="sensor-unit">NTU</div>
            <div class="sensor-range" id="range-turbidity"></div>
            <div class="card-badge" id="badge-turbidity"></div>
          </div>

          <div class="sensor-divider"></div>

          <div class="sensor-block color-humidity">
            <div class="sensor-sub-label">Humedad módulo</div>
            <div class="sensor-value" id="val-humidity">—</div>
            <div class="sensor-unit">%</div>
            <div class="sensor-range" id="range-humidity"></div>
            <div class="card-badge" id="badge-humidity"></div>
          </div>

        </div>
      </div>

      <!-- ── Row 2: energy card + axolotl card ── -->
      <section class="cards cards--wide">

        <!-- Energy card: voltage + current side by side, solar status below -->
        <div class="card card--energy">
          <div class="card-label">Energía</div>
          <div class="energy-row">
            <div class="energy-block color-voltage">
              <div class="energy-sub-label">Voltaje</div>
              <div class="energy-value" id="val-voltage">—</div>
              <div class="energy-unit">V</div>
              <div class="energy-badge" id="badge-voltage"></div>
            </div>
            <div class="energy-divider"></div>
            <div class="energy-block color-current">
              <div class="energy-sub-label">Corriente</div>
              <div class="energy-value" id="val-current">—</div>
              <div class="energy-unit">A</div>
              <div class="energy-badge" id="badge-current"></div>
            </div>
          </div>
          <div class="solar-row">
            <span class="solar-dot" id="solar-dot"></span>
            <span class="solar-status" id="solar-status">Panel solar: —</span>
            <span class="solar-manual-label">Control manual</span>
            <button class="solar-btn" id="solar-btn" onclick="App.toggleSolar()">Encender</button>
          </div>
        </div>

        <!-- Axolotl card: presence + AI confidence -->
        <div class="card card--axolotl">
          <div class="card-label">Presencia Ajolote</div>
          <div class="card-presence" id="val-presence">—</div>
          <div class="card-confidence" id="val-confidence"></div>
        </div>

      </section>

      <!-- ── Single switchable chart ── -->
      <section class="chart-section">
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title-label" id="chart-title-label">Temperatura — histórico</span>
            <span class="chart-subtitle" id="chart-range-label"></span>
          </div>

          <!-- Variable selector buttons -->
          <div class="chart-selector">
            <button class="chart-btn active" data-key="temp_c">Temp</button>
            <button class="chart-btn" data-key="ph">pH</button>
            <button class="chart-btn" data-key="turbidity">Turbidez</button>
            <button class="chart-btn" data-key="humidity">Humedad</button>
            <button class="chart-btn" data-key="voltage">Voltaje</button>
            <button class="chart-btn" data-key="current">Corriente</button>
          </div>

          <div class="chart-wrap">
            <canvas id="chart-main"></canvas>
          </div>
        </div>
      </section>

      <!-- ── Message log ── -->
      <section class="log-section">
        <div class="log-header">
          <span class="chart-title-label">Registro de mensajes</span>
          <button class="btn-clear" onclick="App.clearLog()">Limpiar</button>
        </div>
        <div class="log" id="log"></div>
      </section>

    </main>
  </div>

  <!-- CDN libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <!-- App scripts — order matters -->
  <script src="thresholds.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const _hbg = document.getElementById("hamburger");
    const _drw = document.getElementById("nav-drawer");
    const _ovl = document.getElementById("nav-overlay");
    function _toggleNav(open) {
      _drw.classList.toggle("open", open);
      _ovl.classList.toggle("open", open);
      _hbg.classList.toggle("open", open);
    }
    _hbg.addEventListener("click", () => _toggleNav(!_drw.classList.contains("open")));
    _ovl.addEventListener("click", () => _toggleNav(false));
  </script>

</body>


</html>
